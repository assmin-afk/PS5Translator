<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
 <defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e4e5e9"/><stop offset="1" stop-color="#a9acb3"/>
  </linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#2a2b30"/><stop offset="1" stop-color="#0a0a0c"/>
  </linearGradient>
  <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#f7f7f9"/><stop offset="1" stop-color="#cfd1d6"/>
  </linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9bcc3"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
   <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".6"/></filter>
 </defs>

 <!-- body -->
 <path filter="url(#sh)" fill="url(#body)" d="M150 92 C190 70 250 78 290 86 L350 86 C390 78 450 70 490 92 C540 120 568 200 590 280 C606 340 590 380 552 384 C516 388 492 360 470 326 C452 298 432 286 404 286 L236 286 C208 286 188 298 170 326 C148 360 124 388 88 384 C50 380 34 340 50 280 C72 200 100 120 150 92 Z"/>

 <!-- black centre (between grips) -->
 <path fill="url(#core)" d="M222 112 L418 112 C440 112 452 124 456 146 L474 244 C478 268 462 286 438 286 L202 286 C178 286 162 268 166 244 L184 146 C188 124 200 112 222 112 Z"/>
 <!-- touchpad -->
 <path fill="url(#pad)" d="M236 96 L404 96 C420 96 428 104 426 120 L420 168 C418 180 410 186 398 186 L242 186 C230 186 222 180 220 168 L214 120 C212 104 220 96 236 96 Z"/>
 <path d="M240 104 L400 104" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>

 <!-- light bar glow -->
 <ellipse cx="320" cy="236" rx="120" ry="60" fill="url(#glow)" opacity=".35"/>

 <!-- MQ badge (logo spot, centre) -->
 <text x="320" y="258" text-anchor="middle" font-family="Inter" font-weight="900" font-style="italic" font-size="60" letter-spacing="-2" fill="url(#txt)">MQ</text>
 <path d="M282 270 L358 270" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>

 <!-- sticks -->
 <circle cx="214" cy="250" r="30" fill="#141417" stroke="#3a3b40" stroke-width="3"/>
 <circle cx="214" cy="250" r="19" fill="#26272c"/>
 <circle cx="426" cy="250" r="30" fill="#141417" stroke="#3a3b40" stroke-width="3"/>
 <circle cx="426" cy="250" r="19" fill="#26272c"/>

 <!-- d-pad -->
 <g fill="#c4c6cc">
  <rect x="122" y="150" width="20" height="26" rx="5"/><rect x="122" y="196" width="20" height="26" rx="5"/>
  <rect x="94" y="176" width="26" height="20" rx="5"/><rect x="144" y="176" width="26" height="20" rx="5"/>
 </g>
 <!-- face buttons -->
 <g fill="none" stroke="#9fa2a9" stroke-width="4">
  <circle cx="508" cy="158" r="12"/><circle cx="508" cy="214" r="12"/>
  <circle cx="480" cy="186" r="12"/><circle cx="536" cy="186" r="12"/>
 </g>
</svg>
