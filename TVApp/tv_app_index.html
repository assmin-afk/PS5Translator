<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PS5 Translator TV</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            font-family: Arial, "Helvetica Neue", sans-serif;
        }
        #setup-panel {
            position: absolute;
            top: 3.7vh;
            left: 2.1vw;
            background: rgba(0, 0, 0, 0.9);
            padding: 2.3vh 1.4vw;
            border-radius: 12px;
            color: white;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            width: 26vw;
        }
        #setup-panel .label {
            font-size: 1.7vh;
            color: #ccc;
            margin: 1.2vh 0 0.5vh;
            display: block;
        }
        #setup-panel .ip-display {
            font-size: 2.1vh;
            color: #76ff03;
            font-weight: bold;
        }
        .field {
            font-size: 1.9vh;
            padding: 0.9vh 0.6vw;
            width: 100%;
            border-radius: 6px;
            border: 2px solid #555;
            background: #222;
            color: white;
            outline: none;
            box-sizing: border-box;
        }
        .field.focused, .field:focus {
            border-color: #007aff;
            box-shadow: 0 0 12px #007aff;
            background: #333;
        }
        #scan-btn { text-align: center; font-weight: bold; }
        /* 1.19: logo MQ trên bảng cài đặt */
        #brand {
            display: flex;
            align-items: center;
            gap: 0.8vw;
            margin-bottom: 0.6vh;
            font-size: 2.2vh;
            font-weight: bold;
            color: #fff;
        }
        #brand img {
            height: 6vh;
            border-radius: 1.2vh;
        }
        #help {
            font-size: 1.35vh;
            color: #aaa;
            margin-top: 1.4vh;
            line-height: 1.5;
        }
        #status-bar {
            position: absolute;
            top: 3.7vh;
            right: 2.1vw;
            background: rgba(0, 0, 0, 0.8);
            padding: 1.1vh 1.25vw;
            color: yellow;
            font-size: 1.9vh;
            border-radius: 8px;
            z-index: 9999;
        }
        /* Lớp phụ đề: phủ đúng 100% khung hình, toạ độ 0..1 giống hệt khung video trên iPhone */
        #overlay-container {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
        }
        .sub-slot {
            position: absolute;
            box-sizing: border-box;
        }
        .sub-bubble {
            position: absolute;
            box-sizing: border-box;
            width: 100%;
            background: rgba(0, 0, 0, 0.86);
            font-weight: bold;
            line-height: 1.2;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div id="setup-panel">
        <div id="brand"><img src="icon.png" alt="MQ">PS5 Translator</div>
        <span class="label">Trạng thái iPhone:</span>
        <div id="ip-display" class="ip-display">Đang tải...</div>

        <span class="label">Cổng HDMI cắm PS5 (Trái/Phải để đổi):</span>
        <select id="hdmi-select" class="field">
            <option value="HDMI 1">HDMI 1</option>
            <option value="HDMI 2">HDMI 2</option>
            <option value="HDMI 3">HDMI 3</option>
            <option value="HDMI 4">HDMI 4</option>
        </select>

        <span class="label">IP iPhone (OK để nhập, xem trong app iPhone):</span>
        <input id="ip-input" class="field" type="text" inputmode="decimal" placeholder="192.168.1.15">

        <span class="label">&nbsp;</span>
        <div id="scan-btn" class="field">Tự tìm iPhone trong mạng Wi-Fi</div>

        <div id="help">
            Lên/Xuống: chọn mục &nbsp;·&nbsp; OK: nhập / tìm<br>
            Ở mục trên cùng bấm <b>Lên</b> để ẩn bảng, bấm <b>Lên</b> lần nữa để hiện lại.
        </div>
    </div>

    <div id="status-bar">Đang khởi động...</div>

    <div id="overlay-container"></div>

    <script src="tv_main.js"></script>
</body>
</html>
