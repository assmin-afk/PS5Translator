name: Dong goi App iPhone (.ipa)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_unsigned_ipa:
    runs-on: macos-latest
    steps:
      - name: 1. Tai code ve may chu Mac
        uses: actions/checkout@v4

      - name: 2. Tu dong gom file Swift va sua loi duoi .txt (neu co)
        run: |
          mkdir -p Sources
          
          # Tu dong doi ten neu Windows luu nham thanh .swift.txt
          for f in *.swift.txt; do
            [ -f "$f" ] && cp "$f" "Sources/${f%.txt}"
          done
          
          # Copy tat ca file .swift vao thu muc Sources
          for f in *.swift; do
            [ -f "$f" ] && cp "$f" "Sources/$f"
          done

          # Kiem tra xem da co file Swift nao trong Sources chua
          echo "Danh sach file Swift tim thay:"
          ls -la Sources/
          if [ -z "$(ls -A Sources/*.swift 2>/dev/null)" ]; then
            echo "LOI: Ban chua tai 6 file .swift len trang Code cua GitHub!"
            exit 1
          fi

          # Tu dong nang cap ham doc SQLite an toan cho Swift moi trong File 5
          if [ -f "Sources/5_PredictiveTranslator.swift" ]; then
            sed -i '' 's/String(cString: sqlite3_column_text(statement, 0))/sqlite3_column_text(statement, 0).flatMap { String(cString: $0) } ?? "0"/g' Sources/5_PredictiveTranslator.swift
            sed -i '' 's/String(cString: sqlite3_column_text(statement, 1))/sqlite3_column_text(statement, 1).flatMap { String(cString: $0) } ?? ""/g' Sources/5_PredictiveTranslator.swift
            sed -i '' 's/String(cString: sqlite3_column_text(statement, 2))/sqlite3_column_text(statement, 2).flatMap { String(cString: $0) } ?? ""/g' Sources/5_PredictiveTranslator.swift
          fi

          if [ -f "game_data.sqlite" ]; then
            cp game_data.sqlite Sources/
          fi

          cat << 'EOF' > project.yml
          name: PS5Translator
          options:
            bundleIdPrefix: com.ps5viet
          targets:
            PS5Translator:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: PS5 Translator
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSLocalNetworkUsageDescription: "Cho phep ket noi Wi-Fi noi bo voi PS5 va TV Samsung de truyen phu de."
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.ps5viet.translator
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
                  AD_HOC_CODE_SIGNING_ALLOWED: YES
          EOF

      - name: 3. Khoi tao Project Xcode bang XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: 4. Bien dich 6 file Swift thanh App iPhone
        run: |
          xcodebuild clean build \
            -project PS5Translator.xcodeproj \
            -target PS5Translator \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build_output" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 5. Dong goi thanh file PS5Translator.ipa
        run: |
          mkdir -p Payload
          cp -r build_output/Release-iphoneos/PS5Translator.app Payload/
          zip -r PS5Translator.ipa Payload

      - name: 6. Xuat file PS5Translator.ipa de tai ve Windows
        uses: actions/upload-artifact@v4
        with:
          name: File_Cai_Dat_PS5Translator_IPA
          path: PS5Translator.ipa
