name: Dong goi App iPhone (.ipa)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_unsigned_ipa:
    runs-on: macos-latest
    steps:
      - name: 1. Tai code va icon.png ve may chu Mac
        uses: actions/checkout@v4

      - name: 2. Gom 6 file Swift va tao Bo Icon App iPhone tu icon.png
        run: |
          mkdir -p Sources

          # Tu dong doi ten neu Windows luu nham thanh .swift.txt
          for f in *.swift.txt; do
            [ -f "$f" ] && cp "$f" "Sources/${f%.txt}"
          done

          # Copy tat ca file .swift vao thu muc Sources
          for f in *.swift; do
            [ -f "$f" ] && cp "$f" "Sources/$f"
          done

          # Neu co file icon.png thi tao bo AppIcon chuan iOS va copy vao App
          if [ -f "icon.png" ]; then
            cp icon.png Sources/icon.png
            mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
            sips -z 1024 1024 icon.png --out Sources/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
            cat << 'EOF' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "Icon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          fi

          if [ -f "game_data.sqlite" ]; then
            cp game_data.sqlite Sources/
          fi

          cat << 'EOF' > project.yml
          name: PS5Translator
          options:
            bundleIdPrefix: com.ps5viet
          targets:
            PS5Translator:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: PS5 Translator
                  UILaunchScreen: {}
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSLocalNetworkUsageDescription: "Cho phep ket noi Wi-Fi noi bo voi PS5 va TV Samsung de truyen phu de."
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.ps5viet.translator
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
                  AD_HOC_CODE_SIGNING_ALLOWED: YES
          EOF

      - name: 3. Khoi tao Project Xcode bang XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: 4. Bien dich 6 file Swift thanh App iPhone
        run: |
          xcodebuild clean build \
            -project PS5Translator.xcodeproj \
            -target PS5Translator \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build_output" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 5. Dong goi thanh file PS5Translator.ipa
        run: |
          mkdir -p Payload
          cp -r build_output/Release-iphoneos/PS5Translator.app Payload/
          zip -r PS5Translator.ipa Payload

      - name: 6. Xuat file PS5Translator.ipa de tai ve Windows
        uses: actions/upload-artifact@v4
        with:
          name: File_Cai_Dat_PS5Translator_IPA
          path: PS5Translator.ipa
