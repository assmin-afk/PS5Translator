name: Dong goi App iPhone (.ipa) voi Loi C Chiaki-NG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_unsigned_ipa:
    runs-on: macos-latest
    steps:
      - name: 1. Tai code du an va icon.png ve may chu Mac
        uses: actions/checkout@v4

      - name: 2. Tai thu vien C goc cua chiaki-ng (rpcrypt.c, regist.c, base64.c)
        run: |
          git clone --depth 1 https://github.com/streetpea/chiaki-ng.git chiaki_upstream || \
          git clone --depth 1 https://git.sr.ht/~thestr4ng3r/chiaki chiaki_upstream

          mkdir -p Sources/ChiakiNative/include/chiaki
          mkdir -p Sources/ChiakiNative/include/openssl
          mkdir -p Sources/ChiakiNative/upstream

          cp chiaki_upstream/lib/src/rpcrypt.c Sources/ChiakiNative/rpcrypt.c
          cp chiaki_upstream/lib/src/base64.c Sources/ChiakiNative/base64.c
          cp chiaki_upstream/lib/src/regist.c Sources/ChiakiNative/upstream/regist.c
          cp -R chiaki_upstream/lib/include/chiaki/* Sources/ChiakiNative/include/chiaki/

          cat << 'EOF' > Sources/ChiakiNative/include/chiaki_export.h
          #ifndef CHIAKI_EXPORT_H
          #define CHIAKI_EXPORT_H
          #define CHIAKI_EXPORT
          #define CHIAKI_NO_EXPORT
          #endif
          EOF

          # Trich xuat toan bo hang so static const + ham chiaki_regist_request_payload_format tu regist.c
          python3 - << 'PYEOF'
          with open("Sources/ChiakiNative/upstream/regist.c", "r", encoding="utf-8") as f:
              src = f.read()

          idx = src.find("chiaki_regist_request_payload_format")
          if idx != -1:
              brace_open = src.find("{", idx)
              depth = 0
              end = brace_open
              for i in range(brace_open, len(src)):
                  if src[i] == "{":
                      depth += 1
                  elif src[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              # Lay toan bo phan dau file regist.c (chua request_inner_online_id_fmt, request_inner_account_id_fmt, client_type...) den het ham
              top_part = src[:end]
              clean_lines = []
              for line in top_part.splitlines():
                  if line.strip().startswith("#include"):
                      continue
                  clean_lines.append(line)

              with open("Sources/ChiakiNative/ChiakiRegistFormat.c", "w", encoding="utf-8") as out:
                  out.write('#include <chiaki/regist.h>\n')
                  out.write('#include <chiaki/rpcrypt.h>\n')
                  out.write('#include <chiaki/base64.h>\n')
                  out.write('#include <chiaki/log.h>\n')
                  out.write('#include <openssl/hmac.h>\n')
                  out.write('#include <string.h>\n')
                  out.write('#include <stdio.h>\n\n')
                  out.write("\n".join(clean_lines) + "\n")
              print("Extracted constants + chiaki_regist_request_payload_format successfully!")
          PYEOF

      - name: 3. Tao Shim OpenSSL Chuan Bit-Exact (CFB128/CBC/ECB) & Cau noi C-Bridge
        run: |
          cat << 'EOF' > Sources/ChiakiNative/include/openssl/evp.h
          #ifndef CHIAKI_OPENSSL_EVP_SHIM_H
          #define CHIAKI_OPENSSL_EVP_SHIM_H

          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <CommonCrypto/CommonCryptor.h>
          #include <CommonCrypto/CommonDigest.h>

          typedef struct {
              int mode; // 0 = CBC, 1 = ECB, 2 = CFB128
          } EVP_CIPHER;

          typedef struct {
              int mode;
              int encrypt;
              uint8_t key[16];
              uint8_t iv[16];
              int num;
          } EVP_CIPHER_CTX;

          static inline const EVP_CIPHER *EVP_aes_128_cbc(void) {
              static const EVP_CIPHER cbc = { 0 };
              return &cbc;
          }

          static inline const EVP_CIPHER *EVP_aes_128_ecb(void) {
              static const EVP_CIPHER ecb = { 1 };
              return &ecb;
          }

          static inline const EVP_CIPHER *EVP_aes_128_cfb128(void) {
              static const EVP_CIPHER cfb = { 2 };
              return &cfb;
          }

          static inline const EVP_CIPHER *EVP_aes_128_cfb(void) {
              return EVP_aes_128_cfb128();
          }

          static inline const void *EVP_sha256(void) {
              return (const void *)1;
          }

          static inline EVP_CIPHER_CTX *EVP_CIPHER_CTX_new(void) {
              return (EVP_CIPHER_CTX *)calloc(1, sizeof(EVP_CIPHER_CTX));
          }

          static inline void EVP_CIPHER_CTX_free(EVP_CIPHER_CTX *ctx) {
              if (ctx) free(ctx);
          }

          static inline int EVP_CIPHER_CTX_init_common(
              EVP_CIPHER_CTX *ctx,
              int encrypt,
              const EVP_CIPHER *cipher,
              const unsigned char *key,
              const unsigned char *iv
          ) {
              if (!ctx) return 0;
              if (cipher) ctx->mode = cipher->mode;
              ctx->encrypt = encrypt;
              if (key) memcpy(ctx->key, key, 16);
              if (iv) memcpy(ctx->iv, iv, 16);
              ctx->num = 0;
              return 1;
          }

          static inline int EVP_EncryptInit_ex(
              EVP_CIPHER_CTX *ctx,
              const EVP_CIPHER *cipher,
              void *impl,
              const unsigned char *key,
              const unsigned char *iv
          ) {
              (void)impl;
              return EVP_CIPHER_CTX_init_common(ctx, 1, cipher, key, iv);
          }

          static inline int EVP_DecryptInit_ex(
              EVP_CIPHER_CTX *ctx,
              const EVP_CIPHER *cipher,
              void *impl,
              const unsigned char *key,
              const unsigned char *iv
          ) {
              (void)impl;
              return EVP_CIPHER_CTX_init_common(ctx, 0, cipher, key, iv);
          }

          static inline int EVP_CIPHER_CTX_set_padding(EVP_CIPHER_CTX *ctx, int pad) {
              (void)ctx; (void)pad;
              return 1;
          }

          static inline int EVP_CipherUpdate_Internal(
              EVP_CIPHER_CTX *ctx,
              unsigned char *out,
              int *outl,
              const unsigned char *in,
              int inl
          ) {
              if (!ctx || inl <= 0) {
                  if (outl) *outl = 0;
                  return 1;
              }

              uint8_t *tmp = (uint8_t *)malloc((size_t)inl + 16);
              if (!tmp) return 0;

              if (ctx->mode == 2) {
                  // Chuan OpenSSL CRYPTO_cfb128_encrypt (AES-128-CFB128 bit-exact)
                  for (int i = 0; i < inl; i++) {
                      if (ctx->num == 0) {
                          size_t moved = 0;
                          CCCrypt(
                              kCCEncrypt,
                              kCCAlgorithmAES,
                              kCCOptionECBMode,
                              ctx->key,
                              16,
                              NULL,
                              ctx->iv,
                              16,
                              ctx->iv,
                              16,
                              &moved
                          );
                      }
                      if (ctx->encrypt) {
                          uint8_t c = in[i] ^ ctx->iv[ctx->num];
                          ctx->iv[ctx->num] = c;
                          tmp[i] = c;
                      } else {
                          uint8_t cc = in[i];
                          uint8_t v = ctx->iv[ctx->num];
                          ctx->iv[ctx->num] = cc;
                          tmp[i] = cc ^ v;
                      }
                      ctx->num = (ctx->num + 1) & 0x0F;
                  }
                  memcpy(out, tmp, (size_t)inl);
                  free(tmp);
                  if (outl) *outl = inl;
                  return 1;
              } else if (ctx->mode == 1) {
                  // AES-128-ECB
                  size_t moved = 0;
                  CCCryptorStatus st = CCCrypt(
                      ctx->encrypt ? kCCEncrypt : kCCDecrypt,
                      kCCAlgorithmAES,
                      kCCOptionECBMode,
                      ctx->key,
                      16,
                      NULL,
                      in,
                      (size_t)inl,
                      tmp,
                      (size_t)inl + 16,
                      &moved
                  );
                  if (st != kCCSuccess) {
                      free(tmp);
                      return 0;
                  }
                  memcpy(out, tmp, moved);
                  free(tmp);
                  if (outl) *outl = (int)moved;
                  return 1;
              } else {
                  // AES-128-CBC (Cap nhat IV lien tuc giua cac lan goi Update)
                  int blocks = inl / 16;
                  for (int b = 0; b < blocks; b++) {
                      const uint8_t *blk_in = in + (b * 16);
                      uint8_t *blk_out = tmp + (b * 16);
                      size_t moved = 0;
                      if (ctx->encrypt) {
                          uint8_t xored[16];
                          for (int j = 0; j < 16; j++) xored[j] = blk_in[j] ^ ctx->iv[j];
                          CCCrypt(kCCEncrypt, kCCAlgorithmAES, kCCOptionECBMode, ctx->key, 16, NULL, xored, 16, blk_out, 16, &moved);
                          memcpy(ctx->iv, blk_out, 16);
                      } else {
                          uint8_t dec[16];
                          CCCrypt(kCCDecrypt, kCCAlgorithmAES, kCCOptionECBMode, ctx->key, 16, NULL, blk_in, 16, dec, 16, &moved);
                          for (int j = 0; j < 16; j++) blk_out[j] = dec[j] ^ ctx->iv[j];
                          memcpy(ctx->iv, blk_in, 16);
                      }
                  }
                  memcpy(out, tmp, (size_t)(blocks * 16));
                  free(tmp);
                  if (outl) *outl = blocks * 16;
                  return 1;
              }
          }

          static inline int EVP_EncryptUpdate(
              EVP_CIPHER_CTX *ctx,
              unsigned char *out,
              int *outl,
              const unsigned char *in,
              int inl
          ) {
              return EVP_CipherUpdate_Internal(ctx, out, outl, in, inl);
          }

          static inline int EVP_DecryptUpdate(
              EVP_CIPHER_CTX *ctx,
              unsigned char *out,
              int *outl,
              const unsigned char *in,
              int inl
          ) {
              return EVP_CipherUpdate_Internal(ctx, out, outl, in, inl);
          }

          static inline int EVP_EncryptFinal_ex(EVP_CIPHER_CTX *ctx, unsigned char *outm, int *outl) {
              (void)ctx; (void)outm;
              if (outl) *outl = 0;
              return 1;
          }

          static inline int EVP_DecryptFinal_ex(EVP_CIPHER_CTX *ctx, unsigned char *outm, int *outl) {
              (void)ctx; (void)outm;
              if (outl) *outl = 0;
              return 1;
          }

          #endif
          EOF

          cat << 'EOF' > Sources/ChiakiNative/include/openssl/hmac.h
          #ifndef CHIAKI_OPENSSL_HMAC_SHIM_H
          #define CHIAKI_OPENSSL_HMAC_SHIM_H

          #include <stddef.h>
          #include <CommonCrypto/CommonHMAC.h>
          #include "evp.h"

          static inline unsigned char *HMAC(
              const void *evp_md,
              const void *key,
              int key_len,
              const unsigned char *d,
              size_t n,
              unsigned char *md,
              unsigned int *md_len
          ) {
              (void)evp_md;
              static unsigned char static_md[CC_SHA256_DIGEST_LENGTH];
              unsigned char *target = md ? md : static_md;
              CCHmac(kCCHmacAlgSHA256, key, (size_t)key_len, d, n, target);
              if (md_len) *md_len = CC_SHA256_DIGEST_LENGTH;
              return target;
          }

          #endif
          EOF

          cat << 'EOF' > Sources/ChiakiNative/include/openssl/sha.h
          #ifndef CHIAKI_OPENSSL_SHA_SHIM_H
          #define CHIAKI_OPENSSL_SHA_SHIM_H
          #include <CommonCrypto/CommonDigest.h>
          #define SHA256_DIGEST_LENGTH CC_SHA256_DIGEST_LENGTH
          #endif
          EOF

          cat << 'EOF' > Sources/ChiakiNative/include/openssl/aes.h
          #ifndef CHIAKI_OPENSSL_AES_SHIM_H
          #define CHIAKI_OPENSSL_AES_SHIM_H
          #define AES_BLOCK_SIZE 16
          #endif
          EOF

          cat << 'EOF' > Sources/ChiakiNative/include/openssl/err.h
          #ifndef CHIAKI_OPENSSL_ERR_SHIM_H
          #define CHIAKI_OPENSSL_ERR_SHIM_H
          #endif
          EOF

          cat << 'EOF' > Sources/ChiakiNative/ChiakiCBridge.h
          #ifndef CHIAKI_C_BRIDGE_H
          #define CHIAKI_C_BRIDGE_H

          #include <stdint.h>
          #include <stddef.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          int chiaki_bridge_build_ps5_regist_payload(
              const char *pin_str,
              const char *account_id_b64,
              const char *client_type_str,
              uint8_t *out_payload,
              size_t *out_len,
              uint8_t out_bright[16],
              uint8_t out_echidna[16],
              uint8_t out_hmac_key[16]
          );

          int chiaki_bridge_decrypt_regist_response(
              const uint8_t *cipher,
              size_t cipher_len,
              const uint8_t bright[16],
              const uint8_t echidna[16],
              const uint8_t hmac_key[16],
              uint8_t *out_plain,
              size_t max_plain_len
          );

          int chiaki_bridge_encrypt_session_data(
              const uint8_t nonce[16],
              const uint8_t rp_key[16],
              uint64_t counter,
              const uint8_t *data_in,
              size_t data_len,
              uint8_t *data_out
          );

          #ifdef __cplusplus
          }
          #endif

          #endif
          EOF

          cat << 'EOF' > Sources/ChiakiNative/ChiakiCBridge.c
          #include "ChiakiCBridge.h"
          #include <chiaki/regist.h>
          #include <chiaki/rpcrypt.h>
          #include <chiaki/base64.h>
          #include <chiaki/log.h>
          #include <CommonCrypto/CommonHMAC.h>
          #include <stdlib.h>
          #include <stdio.h>
          #include <string.h>
          #include <Security/SecRandom.h>

          static ChiakiRPCrypt g_last_rpcrypt;
          static int g_has_last_rpcrypt = 0;

          __attribute__((weak)) void chiaki_log(ChiakiLog *log, ChiakiLogLevel level, const char *fmt, ...) {
              (void)log; (void)level; (void)fmt;
          }

          __attribute__((weak)) const char *chiaki_error_string(ChiakiErrorCode code) {
              (void)code;
              return "chiaki_err";
          }

          __attribute__((weak)) ChiakiErrorCode chiaki_random_bytes_crypt(uint8_t *buf, size_t buf_size) {
              if (SecRandomCopyBytes(kSecRandomDefault, buf_size, buf) == errSecSuccess) {
                  return CHIAKI_ERR_SUCCESS;
              }
              for (size_t i = 0; i < buf_size; i++) {
                  buf[i] = (uint8_t)(arc4random() & 0xFF);
              }
              return CHIAKI_ERR_SUCCESS;
          }

          int chiaki_bridge_build_ps5_regist_payload(
              const char *pin_str,
              const char *account_id_b64,
              const char *client_type_str,
              uint8_t *out_payload,
              size_t *out_len,
              uint8_t out_bright[16],
              uint8_t out_echidna[16],
              uint8_t out_hmac_key[16]
          ) {
              (void)client_type_str;
              if (!pin_str || !account_id_b64 || !out_payload || !out_len) {
                  return -1;
              }

              uint32_t pin = (uint32_t)strtoul(pin_str, NULL, 10);
              uint8_t ambassador[16];
              chiaki_random_bytes_crypt(ambassador, 16);

              uint8_t decoded_aid[16] = {0};
              size_t decoded_len = sizeof(decoded_aid);
              if (chiaki_base64_decode(account_id_b64, strlen(account_id_b64) + 1, decoded_aid, &decoded_len) != CHIAKI_ERR_SUCCESS || decoded_len < 8) {
                  decoded_len = sizeof(decoded_aid);
                  if (chiaki_base64_decode(account_id_b64, strlen(account_id_b64), decoded_aid, &decoded_len) != CHIAKI_ERR_SUCCESS || decoded_len < 8) {
                      return -2;
                  }
              }

              ChiakiRegistInfo info;
              memset(&info, 0, sizeof(info));
              info.psn_online_id = "Maivy1125";
              memcpy(info.psn_account_id, decoded_aid, 8);
              info.pin = pin;

              ChiakiLog dummy_log;
              memset(&dummy_log, 0, sizeof(dummy_log));
              memset(&g_last_rpcrypt, 0, sizeof(g_last_rpcrypt));

              size_t buf_size = 1024;
              ChiakiErrorCode err = chiaki_regist_request_payload_format(
                  &dummy_log,
                  CHIAKI_TARGET_PS5_1,
                  ambassador,
                  out_payload,
                  &buf_size,
                  &g_last_rpcrypt,
                  &info
              );
              if (err != CHIAKI_ERR_SUCCESS) {
                  return -3;
              }

              g_has_last_rpcrypt = 1;
              memcpy(out_bright, g_last_rpcrypt.bright, 16);
              memcpy(out_echidna, g_last_rpcrypt.ambassador, 16);
              memcpy(out_hmac_key, g_last_rpcrypt.bright, 16);

              *out_len = buf_size;
              return 0;
          }

          int chiaki_bridge_decrypt_regist_response(
              const uint8_t *cipher,
              size_t cipher_len,
              const uint8_t bright[16],
              const uint8_t echidna[16],
              const uint8_t hmac_key[16],
              uint8_t *out_plain,
              size_t max_plain_len
          ) {
              (void)bright; (void)echidna; (void)hmac_key;
              if (!cipher || cipher_len <= 0x20 || !out_plain || !g_has_last_rpcrypt) return -1;

              ChiakiRPCrypt rpcrypt = g_last_rpcrypt;
              size_t enc_len = cipher_len - 0x20;
              if (enc_len >= max_plain_len) enc_len = max_plain_len - 1;

              if (chiaki_rpcrypt_decrypt(&rpcrypt, 0, cipher + 0x20, out_plain, enc_len) != CHIAKI_ERR_SUCCESS) {
                  return -2;
              }
              out_plain[enc_len] = 0;
              return (int)enc_len;
          }

          int chiaki_bridge_encrypt_session_data(
              const uint8_t nonce[16],
              const uint8_t rp_key[16],
              uint64_t counter,
              const uint8_t *data_in,
              size_t data_len,
              uint8_t *data_out
          ) {
              if (!nonce || !rp_key || !data_in || !data_out) return -1;

              ChiakiRPCrypt rpcrypt;
              memset(&rpcrypt, 0, sizeof(rpcrypt));
              chiaki_rpcrypt_init_auth(&rpcrypt, CHIAKI_TARGET_PS5_1, nonce, rp_key);
              if (chiaki_rpcrypt_encrypt(&rpcrypt, counter, data_in, data_out, data_len) != CHIAKI_ERR_SUCCESS) {
                  return -3;
              }
              return 0;
          }
          EOF

          cat << 'EOF' > Sources/PS5Translator-Bridging-Header.h
          #include "ChiakiNative/ChiakiCBridge.h"
          EOF

      - name: 4. Gom cac file Swift va BAT BUOC moc noi C-Bridge vao Swift
        run: |
          for f in *.swift.txt; do
            [ -f "$f" ] && cp "$f" "Sources/${f%.txt}"
          done

          for f in *.swift; do
            [ -f "$f" ] && cp "$f" "Sources/$f"
          done

          python3 - << 'PYEOF'
          import glob, os, re

          files = sorted(glob.glob("Sources/*.swift"))
          seen_main = False
          for p in files:
              with open(p, "r", encoding="utf-8") as f:
                  txt = f.read()
              if "@main" in txt:
                  if seen_main:
                      print(f"Removing duplicate @main file: {p}")
                      os.remove(p)
                      continue
                  seen_main = True

          for path in glob.glob("Sources/*.swift"):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              modified = False

              if "stopCapture(completionHandler: nil)" in content:
                  content = content.replace("stopCapture(completionHandler: nil)", "stopCapture { _ in }")
                  modified = True

              if "static let rpClientType =" in content:
                  content = re.sub(
                      r'static let rpClientType\s*=\s*"[^"]+"',
                      'static let rpClientType = "dabfa2ec873de5839bee8d3f4c0239c4282c07c25c6077a2931afcf0adc0d34f"',
                      content
                  )
                  modified = True

              # BAT BUOC moc noi ham buildChiakiPS5RegistPayload480 sang C-Bridge (trong khoi do {} de khong trung bien)
              target_sig = "func buildChiakiPS5RegistPayload480(pinString: String, accountIDBase64: String) -> (payload: Data, aesKey: [UInt8], iv: [UInt8]) {"
              if target_sig in content and "chiaki_bridge_build_ps5_regist_payload" not in content:
                  c_hook = """func buildChiakiPS5RegistPayload480(pinString: String, accountIDBase64: String) -> (payload: Data, aesKey: [UInt8], iv: [UInt8]) {
              do {
                  let cAidB64 = accountIDBase64.trimmingCharacters(in: .whitespacesAndNewlines)
                  var outPayload = [UInt8](repeating: 0, count: 1024)
                  var outLen: Int = 0
                  var bright = [UInt8](repeating: 0, count: 16)
                  var echidna = [UInt8](repeating: 0, count: 16)
                  var hmacKey = [UInt8](repeating: 0, count: 16)

                  let res = pinString.withCString { pinCStr in
                      cAidB64.withCString { aidCStr in
                          ROIDefaultConfig.rpClientType.withCString { clientCStr in
                              chiaki_bridge_build_ps5_regist_payload(
                                  pinCStr,
                                  aidCStr,
                                  clientCStr,
                                  &outPayload,
                                  &outLen,
                                  &bright,
                                  &echidna,
                                  &hmacKey
                              )
                          }
                      }
                  }
                  if res == 0 && outLen > 0 {
                      return (Data(outPayload.prefix(outLen)), bright, echidna)
                  }
              }
          """
                  content = content.replace(target_sig, c_hook, 1)
                  modified = True

              # BAT BUOC moc noi ham decryptRegistResponse sang C-Bridge
              decrypt_sig = "func decryptRegistResponse(cipherData: Data, aesKey: [UInt8], iv: [UInt8]) -> String? {"
              if decrypt_sig in content and "chiaki_bridge_decrypt_regist_response" not in content:
                  decrypt_hook = """func decryptRegistResponse(cipherData: Data, aesKey: [UInt8], iv: [UInt8]) -> String? {
              if cipherData.count > 0x20 && aesKey.count == 16 && iv.count == 16 {
                  var plainBuf = [UInt8](repeating: 0, count: 2048)
                  let cipherBytes = [UInt8](cipherData)
                  let decLen = chiaki_bridge_decrypt_regist_response(
                      cipherBytes,
                      cipherBytes.count,
                      aesKey,
                      iv,
                      nil,
                      &plainBuf,
                      plainBuf.count
                  )
                  if decLen > 0 {
                      let data = Data(plainBuf.prefix(Int(decLen)))
                      if let text = String(data: data, encoding: .utf8) ?? String(data: data, encoding: .isoLatin1),
                         (text.contains("PS5-RegistKey") || text.contains("RP-RegistKey") || text.contains("RP-Key")) {
                          return text.trimmingCharacters(in: CharacterSet(charactersIn: "\\0"))
                      }
                  }
              }
          """
                  content = content.replace(decrypt_sig, decrypt_hook, 1)
                  modified = True

              if modified:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Successfully hooked C-Bridge into {path}")
          PYEOF

          if [ -f "icon.png" ]; then
            cp icon.png Sources/icon.png
            mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
            sips -z 1024 1024 icon.png --out Sources/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
            cat << 'EOF' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "Icon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          fi

          if [ -f "game_data.sqlite" ]; then
            cp game_data.sqlite Sources/
          fi

          cat << 'EOF' > project.yml
          name: PS5Translator
          options:
            bundleIdPrefix: com.ps5viet
          targets:
            PS5Translator:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources
                  excludes:
                    - "ChiakiNative/upstream/**"
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: PS5 Translator
                  UILaunchScreen: {}
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSLocalNetworkUsageDescription: "Cho phep ket noi Wi-Fi noi bo voi PS5 va TV Samsung de truyen phu de."
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.ps5viet.translator
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  SWIFT_OBJC_BRIDGING_HEADER: Sources/PS5Translator-Bridging-Header.h
                  HEADER_SEARCH_PATHS:
                    - "$(inherited)"
                    - "$(PROJECT_DIR)/Sources/ChiakiNative/include"
                  OTHER_CFLAGS:
                    - "$(inherited)"
                    - "-Wno-implicit-function-declaration"
                    - "-Wno-strict-prototypes"
                    - "-Wno-documentation"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
                  AD_HOC_CODE_SIGNING_ALLOWED: YES
          EOF

      - name: 5. Khoi tao Project Xcode bang XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: 6. Bien dich Swift + Loi C Chiaki-NG thanh App iPhone
        run: |
          xcodebuild clean build \
            -project PS5Translator.xcodeproj \
            -target PS5Translator \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build_output" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 7. Dong goi thanh file PS5Translator.ipa
        run: |
          mkdir -p Payload
          cp -r build_output/Release-iphoneos/PS5Translator.app Payload/
          zip -r PS5Translator.ipa Payload

      - name: 8. Xuat file PS5Translator.ipa de tai ve Windows
        uses: actions/upload-artifact@v4
        with:
          name: File_Cai_Dat_PS5Translator_IPA
          path: PS5Translator.ipa
